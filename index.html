tf('t9',2,'Về phủ định mệnh đề:',['Phủ định của “∀x ∈ ℝ, x² + 1 > 0” là “∃x ∈ ℝ, x² + 1 ≤ 0”','“∃x ∈ ℝ, x² + 1 ≤ 0” là mệnh đề đúng','“∀x ∈ ℝ, x² + 1 > 0” là mệnh đề đúng','Phủ định của “∃x ∈ ℤ, 2x = 1” là “∀x ∈ ℤ, 2x ≠ 1”'],[1,0,1,1],'x² + 1 ≥ 1 > 0 với mọi x thực.'),
tf('t10',3,'Khảo sát 100 học sinh: 60 em thích Toán, 50 em thích Tin, 20 em thích cả hai:',['Số em thích ít nhất một môn là 90','Số em chỉ thích Toán là 40','Số em chỉ thích Tin là 20','Số em không thích môn nào là 10'],[1,1,0,1],'60 + 50 − 20 = 90; chỉ Toán 40; chỉ Tin 30; không thích: 10.'),

].forEach(x=>B[x.id]=x);
[

sa('s10',1,'Mệnh đề “Nếu 2 + 2 = 5 thì 3 > 4” đúng hay sai? Ghi 1 nếu đúng, 0 nếu sai.',1,0,'P sai nên P ⇒ Q đúng.'),

sa('s14',2,'Lớp 50 em, 30 em giỏi Toán, 25 em giỏi Văn, mỗi em giỏi ít nhất một trong hai môn. Có bao nhiêu em giỏi cả hai môn?',5,0,'30 + 25 − 50 = 5.'),
sa('s15',3,'Có bao nhiêu số nguyên m để A = [m; m + 2] là tập con của B = [1; 4]?',2,0,'1 ≤ m ≤ 2 nên m ∈ {1; 2}.'),
sa('s16',3,'Khảo sát 200 người: 120 người dùng điện thoại A, 90 người dùng điện thoại B, 30 người dùng cả hai. Có bao nhiêu người không dùng loại nào?',20,0,'200 − (120 + 90 − 30) = 20.'),
sa('s17',3,'Cho A = [−5; 2) và B = (−2; 4]. Có bao nhiêu số nguyên thuộc A \\ B?',4,0,'A \\ B = [−5; −2] gồm −5, −4, −3, −2.'),
sa('s18',3,'Có bao nhiêu tập X thỏa {1; 2} ⊂ X ⊂ {1; 2; 3; 4; 5}?',8,0,'X chứa 1, 2 và một tập con tùy ý của {3; 4; 5}: 2³ = 8.')
].forEach(x=>B[x.id]=x);
Object.values(B).forEach(q=>{if(q.t=='mc'&&q.a===0){const k=(+q.id.slice(1))%4;if(k){q.o=q.o.slice(4-k).concat(q.o.slice(0,4-k));q.a=k}}});
const ST={
g1:{n:'Nhóm 1 · Ôn lại lý thuyết',ids:['m1','m2','m3','m4','m12','m14','m15','m16','t1','t6','s1','s9','s10'],min:0},
g2a:{n:'Nhóm 2 · Trắc nghiệm 4 đáp án',ids:['m5','m6','m7','m8','m9','m10','m11','m13','m17','m18','m19','m20','m21','m22','m23','m24','m25','m26','m27','m28','m29','m30'],min:0},
g2b:{n:'Nhóm 2 · Trắc nghiệm đúng / sai',ids:['t2','t3','t4','t5','t7','t8','t9','t10','t11','t12'],min:0},
g2c:{n:'Nhóm 2 · Trả lời ngắn',ids:['s2','s3','s4','s5','s6','s7','s8','s11','s12','s13','s14','s15','s16','s17','s18'],min:0},
e1:{n:'Đề ôn tập số 1',ids:['m1','m3','m12','m15','m6','m8','m17','m20','m24','m25','m10','m29','t6','t2','t8','t10','s1','s9','s2','s11','s6','s15'],min:45},
e2:{n:'Đề ôn tập số 2',ids:['m2','m4','m13','m16','m18','m19','m21','m22','m7','m27','m26','m30','t1','t7','t9','t11','s10','s3','s13','s14','s7','s16'],min:45},
e3:{n:'Đề ôn tập số 3',ids:['m5','m14','m12','m16','m23','m9','m20','m22','m25','m28','m11','m26','t6','t3','t5','t12','s5','s12','s4','s8','s17','s18'],min:50}};
const TO={mc:0,tf:1,sa:2};Object.values(ST).forEach(s=>s.ids.sort((x,y)=>TO[B[x].t]-TO[B[y].t]||B[x].lv-B[y].lv));
const LV=['','Nhận biết','Thông hiểu','Vận dụng'];
let me=LS.g('me10',{name:'',cls:''}),tab='lt',run=null,tick=null,dbh=null,isT=false;
function who(){$('#who').innerHTML=me.name?`<b>${me.name}</b> · lớp ${me.cls} <button class="b g" style="padding:5px 12px;margin-left:8px" onclick="me={name:'',cls:''};LS.s('me10',me);who()">Đổi</button>`:`<b>Nhập thông tin trước khi làm bài</b><div class="row"><input id="nm" placeholder="Họ và tên"><input id="cl" placeholder="Lớp (ví dụ 10A1)"></div><button class="b" onclick="saveMe()">Lưu</button>`}
function saveMe(){const n=$('#nm').value.trim(),c=$('#cl').value.trim().toUpperCase();if(!n||!c)return alert('Hãy nhập đủ họ tên và lớp.');me={name:n,cls:c};LS.s('me10',me);who()}
function nav(){const t=[['lt','Lý thuyết'],['lp','Luyện tập'],['de','Đề ôn tập'],['kq','Kết quả']];if(isT)t.push(['gv','Giáo viên']);$('#nav').innerHTML=t.map(([k,n])=>`<button class="${tab==k?'on':''}" onclick="go('${k}')">${n}</button>`).join('')}
function go(t){if(run&&!confirm('Thoát bài đang làm? Bài chưa nộp sẽ không được lưu.'))return;stop();run=null;tab=t;nav();draw()}
function draw(){const v=$('#v');scrollTo(0,0);
if(tab=='lt')v.innerHTML=theory();
else if(tab=='lp')v.innerHTML=['g1','g2a','g2b','g2c'].map(k=>setCard(k)).join('');
else if(tab=='de')v.innerHTML=`<p class="sub">Mỗi đề 22 câu theo cấu trúc Bộ GD&ĐT: 12 câu trắc nghiệm 4 đáp án (0,25 điểm/câu), 4 câu đúng/sai (tối đa 1 điểm/câu), 6 câu trả lời ngắn (0,5 điểm/câu); thang điểm 10; tự nộp khi hết giờ.</p>`+['e1','e2','e3'].map(k=>setCard(k)).join('');
else if(tab=='kq')hist();else teacher()}
function setCard(k){const s=ST[k];return `<div class="card set"><h2>${s.n}</h2><span>${s.ids.length} câu${s.min?` · <b>${s.min} phút</b>`:' · không giới hạn thời gian'}</span><button class="b" onclick="start('${k}')">Bắt đầu làm</button></div>`}
function theory(){return `<div class="card"><h2>Bản đồ kiến thức</h2><p>Chương I (Toán 10, Kết nối tri thức) gồm hai mạch: <b>Mệnh đề</b> (khẳng định đúng/sai, phủ định, kéo theo, tương đương, ∀ và ∃) và <b>Tập hợp</b> (tập con, khoảng/đoạn, giao, hợp, hiệu, phần bù). Hai mạch gặp nhau ở các bài toán đếm phần tử trong thực tiễn.</p></div>
<details class="card" open><summary>1. Mệnh đề, mệnh đề chứa biến</summary><p>Mệnh đề là câu khẳng định có tính đúng hoặc sai (không thể vừa đúng vừa sai). Câu hỏi, câu cảm thán không phải mệnh đề. Mệnh đề chứa biến như “n chia hết cho 3” chỉ trở thành mệnh đề khi gán giá trị cho n.</p></details>
<details class="card"><summary>2. Phủ định, kéo theo, đảo, tương đương</summary><div class="f">Phủ định của P: P̄ (đúng khi P sai)</div>${tb(['P','Q','P ⇒ Q','P ⇔ Q'],[['Đ','Đ','Đ','Đ'],['Đ','S','S','S'],['S','Đ','Đ','S'],['S','S','Đ','Đ']])}<p>Mệnh đề đảo của P ⇒ Q là Q ⇒ P. P ⇔ Q đúng khi cả P ⇒ Q và Q ⇒ P cùng đúng. Ngôn ngữ: “P là điều kiện đủ để có Q”, “Q là điều kiện cần để có P”.</p></details>
<details class="card"><summary>3. Kí hiệu ∀, ∃ và phủ định</summary>${tb(['Mệnh đề','Phủ định'],[['∀x ∈ X, P(x)','∃x ∈ X, P̄(x)'],['∃x ∈ X, P(x)','∀x ∈ X, P̄(x)']])}<p>Khi phủ định, đổi ∀ ↔ ∃ và phủ định phần điều kiện (“>” thành “≤”, “=” thành “≠”).</p></details>
<details class="card"><summary>4. Tập hợp, tập con, các tập số</summary><p>a ∈ A: a thuộc A. A ⊂ B: mọi phần tử của A đều thuộc B. A = B khi A ⊂ B và B ⊂ A. ∅ là tập con của mọi tập. Tập có n phần tử có 2ⁿ tập con. Ta có ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ.</p>${tb(['Kí hiệu','Tập hợp','Hiểu là'],[['[a; b]','{x ∈ ℝ | a ≤ x ≤ b}','đoạn'],['(a; b)','{x ∈ ℝ | a < x < b}','khoảng'],['[a; b)','{x ∈ ℝ | a ≤ x < b}','nửa khoảng'],['(−∞; a]','{x ∈ ℝ | x ≤ a}','nửa khoảng vô hạn']])}</details>
<details class="card"><summary>5. Giao, hợp, hiệu, phần bù</summary>${tb(['Phép toán','Kí hiệu','Gồm các phần tử'],[['Giao','A ∩ B','thuộc cả A và B'],['Hợp','A ∪ B','thuộc A hoặc thuộc B'],['Hiệu','A \\ B','thuộc A nhưng không thuộc B'],['Phần bù','C<sub>E</sub>A = E \\ A','thuộc E nhưng không thuộc A (A ⊂ E)']])}<div class="f">n(A ∪ B) = n(A) + n(B) − n(A ∩ B)</div><p>Công thức này dùng cho bài toán đếm trong thực tiễn: học sinh tham gia hai câu lạc bộ, hai môn học, hai phương án khảo sát.</p></details>
<div class="card"><h2>Ví dụ mẫu</h2><p>Lớp 40 học sinh: 25 em học tiếng Anh (A), 18 em học tiếng Pháp (B), 5 em học cả hai. Số em học ít nhất một thứ tiếng là n(A ∪ B) = 25 + 18 − 5 = 38. Số em không học ngoại ngữ nào là 40 − 38 = 2.</p>${tb(['Chỉ Anh','Chỉ Pháp','Cả hai','Không học'],[['20','13','5','2']])}</div>`}
function start(k){if(!me.name)return alert('Hãy nhập họ tên và lớp ở phần trên trước.');const s=ST[k];run={k,a:{},t0:Date.now(),left:s.min*60,done:false};render();if(s.min){tick=setInterval(()=>{run.left--;const e=$('#tm');if(e)e.textContent=fmt(run.left);if(run.left<=0)submit()},1000)}}
const fmt=x=>`${String(Math.floor(x/60)).padStart(2,'0')}:${String(x%60).padStart(2,'0')}`;
function stop(){clearInterval(tick)}
function render(){const s=ST[run.k],d=run.done;$('#v').innerHTML=`<div class="bar"><b>${s.n}</b><span id="tm">${s.min?fmt(run.left):'Tự do'}</span></div><div class="card">${s.ids.map((id,i)=>qh(B[id],i,d)).join('')}</div>`+(d?`<button class="b" onclick="go('lp')">Về danh sách</button>`:`<button class="b" onclick="if(confirm('Nộp bài?'))submit()">Nộp bài</button>`)}
function qh(q,i,d){const a=run.a[q.id];let h=`<div class="q"><span class="tag">Câu ${i+1}</span><span class="tag">${LV[q.lv]}</span><div style="margin-top:6px">${q.q}</div>`;
if(q.t=='mc')h+=q.o.map((o,j)=>`<button class="opt ${d?(j==q.a?'ok':a==j?'no':''):(a==j?'sel':'')}" ${d?'disabled':''} onclick="pick('${q.id}',${j})">${'ABCD'[j]}. ${o}</button>`).join('');
else if(q.t=='tf')h+=q.o.map((o,j)=>{const v=(a||[])[j],c=q.a[j];const cl=x=>d?(c==x?'ok':v==x?'no':''):(v==x?'sel':'');return `<div class="tf"><span>${'abcd'[j]}) ${o}</span><button class="${cl(1)}" ${d?'disabled':''} onclick="tfp('${q.id}',${j},1)">Đúng</button><button class="${cl(0)}" ${d?'disabled':''} onclick="tfp('${q.id}',${j},0)">Sai</button></div>`}).join('');
else h+=`<input inputmode="decimal" placeholder="Đáp số" value="${a??''}" ${d?'disabled':''} oninput="run.a['${q.id}']=this.value">`+(d?`<div>Đáp án: <b>${String(q.a).replace('.',',')}</b></div>`:'');
if(d)h+=`<div class="ex">${q.e}</div>`;return h+'</div>'}
function pick(id,j){run.a[id]=j;render()}
function tfp(id,j,v){const a=run.a[id]||[];a[j]=v;run.a[id]=a;render()}
function frac(q,a){if(q.t=='mc')return a===q.a?1:0;if(q.t=='tf'){let c=0;q.a.forEach((x,j)=>{if((a||[])[j]===x)c++});return[0,.1,.25,.5,1][c]}const v=parseFloat(String(a??'').replace(',','.'));return isFinite(v)&&Math.abs(v-q.a)<=q.tol+1e-9?1:0}
async function submit(){if(!run||run.done)return;stop();run.done=true;const s=ST[run.k];const w=s.ids.map(id=>({mc:.25,tf:1,sa:.5})[B[id].t]);const f=s.ids.map(id=>frac(B[id],run.a[id]));const sc=Math.round(f.reduce((x,y,i)=>x+y*w[i],0)/w.reduce((x,y)=>x+y,0)*1000)/100,ok=f.filter(x=>x==1).length,sec=Math.min(Math.round((Date.now()-run.t0)/1000),s.min?s.min*60:1e5);
const r={id:Date.now()+''+Math.floor(Math.random()*1e3),name:me.name,cls:me.cls,set:run.k,title:s.n,score:sc,ok,total:s.ids.length,sec,at:Date.now()};
LS.s('h10',[r,...LS.g('h10',[])].slice(0,100));let msg='Đã lưu kết quả trên thiết bị này.';
try{if(dbh){await dbh.collection('results').doc(r.id).set(r);msg='Đã gửi kết quả cho giáo viên.'}}catch(e){msg='Chưa gửi được cho giáo viên (cần quyền Contributor).'}
render();$('#v').insertAdjacentHTML('afterbegin',`<div class="card" style="text-align:center"><div class="big">${String(sc).replace('.',',')}/10</div><p>Đúng hoàn toàn ${ok}/${r.total} câu · thời gian ${fmt(sec)}<br><small>${msg}</small></p></div>`);scrollTo(0,0)}
function hist(){const h=LS.g('h10',[]);$('#v').innerHTML=`<div class="card"><h2>Thống kê điểm của bạn</h2>${h.length?(()=>{const m=h.map(x=>x.score);const by={};h.forEach(x=>{(by[x.title]=by[x.title]||[]).push(x.score)});return `<p>Số lần làm: <b>${h.length}</b> · Điểm TB: <b>${(m.reduce((a,b)=>a+b,0)/m.length).toFixed(1)}</b> · Cao nhất: <b>${Math.max(...m)}</b></p>`+tb(['Ngày','Bài','Điểm','Đúng','Thời gian'],h.map(x=>[new Date(x.at).toLocaleDateString('vi-VN'),x.title,x.score,`${x.ok}/${x.total}`,fmt(x.sec)]))})():'<p>Chưa có bài nào. Hãy vào “Luyện tập” để bắt đầu.</p>'}</div>`}
async function teacher(){const v=$('#v');v.innerHTML='<div class="card">Đang tải dữ liệu…</div>';let rs=[];try{rs=(await dbh.collection('results').get()).docs.map(d=>d.data())}catch(e){v.innerHTML='<div class="card">Không tải được dữ liệu.</div>';return}
if(!rs.length){v.innerHTML='<div class="card"><h2>Chưa có kết quả</h2><p>Chia sẻ trang này cho học sinh với quyền Contributor để điểm tự động gửi về.</p></div>';return}
const cs=[...new Set(rs.map(r=>r.cls))].sort(),av=a=>a.reduce((x,y)=>x+y,0)/a.length;
const ct=cs.map(c=>{const a=rs.filter(r=>r.cls==c);return [c,new Set(a.map(r=>r.name)).size,a.length,av(a.map(r=>r.score)).toFixed(1),Math.max(...a.map(r=>r.score))]});
const sel=window.fc||'';const list=rs.filter(r=>!sel||r.cls==sel);const st={};list.forEach(r=>{const k=r.cls+'|'+r.name;(st[k]=st[k]||[]).push(r)});
const rows=Object.values(st).map(a=>{a.sort((x,y)=>y.at-x.at);return [a[0].name,a[0].cls,a.length,av(a.map(r=>r.score)).toFixed(1),a[0].score,a[0].title]}).sort((x,y)=>y[3]-x[3]);
v.innerHTML=`<div class="card"><h2>Thống kê theo lớp</h2>${tb(['Lớp','Học sinh','Lượt làm','Điểm TB','Cao nhất'],ct)}</div><div class="card"><h2>Thống kê theo học sinh</h2><select onchange="window.fc=this.value;teacher()"><option value="">Tất cả lớp</option>${cs.map(c=>`<option ${c==sel?'selected':''}>${c}</option>`).join('')}</select>${tb(['Họ tên','Lớp','Lượt','Điểm TB','Gần nhất','Bài gần nhất'],rows)}</div>`}
who();nav();draw();
(async()=>{try{const u=await claude.use('user');dbh=await claude.use('db');isT=!!(u&&await u.canEdit()&&dbh);nav()}catch(e){}})();
</script></body></html>
